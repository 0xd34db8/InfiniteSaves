<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Infinite Saves — MDickie Save Editor</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('mdickie_editor_theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'crimson') {
            document.documentElement.classList.add('dark', 'theme-crimson');
          } else if (saved === 'dark' || (!saved && systemDark) || (saved === 'system' && systemDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark', 'theme-crimson');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAFAFA] dark:bg-[#0A0A0A] text-neutral-900 dark:text-[#EDEDED] antialiased selection:bg-neutral-200 dark:selection:bg-neutral-800 selection:text-neutral-900 dark:selection:text-neutral-100 overflow-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
